<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7f2;
            --panel: #ffffff;
            --text: #1f2a24;
            --muted: #6a746d;
            --line: #dce3dd;
            --primary: #2f6f4e;
            --primary-dark: #24573d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .page {
            width: min(640px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }

        .back-link {
            display: inline-flex;
            margin-bottom: 18px;
            color: var(--primary-dark);
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        .panel {
            padding: 24px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(31, 42, 36, 0.08);
        }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 22px;
            font-size: clamp(30px, 5vw, 42px);
            line-height: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            min-height: 46px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(47, 111, 78, 0.14);
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px;
        }

        .button,
        .secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .button {
            border: 1px solid var(--primary);
            background: var(--primary);
            color: #ffffff;
        }

        .button:hover {
            background: var(--primary-dark);
        }

        .secondary {
            border: 1px solid var(--line);
            background: #ffffff;
            color: var(--primary-dark);
        }

        @media (max-width: 520px) {
            .page {
                width: min(100% - 24px, 640px);
                padding: 28px 0;
            }

            .panel {
                padding: 18px;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <a class="back-link" href="{% url 'task_list' %}">Back to tasks</a>

        <section class="panel">
            <p class="eyebrow">Life OS</p>
            <h1>Edit Task</h1>

            <form method="POST">
                {% csrf_token %}

                <label for="title">Task name</label>
                <input id="title" type="text" name="title" value="{{ task.title }}" required>

                <div class="actions">
                    <a class="secondary" href="{% url 'task_list' %}">Cancel</a>
                    <button class="button" type="submit">Save Changes</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
